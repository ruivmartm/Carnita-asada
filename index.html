<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#C1410B">
  <meta name="description" content="40 recetas completas para tu carnita asada perfecta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Carnita Asada">
  <title>Carnita Asada 🔥</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+3:wght@400;500;600&display=swap');
    :root {
      --orange: #C1410B;
      --orange-light: #FFF7ED;
      --orange-border: #FED7AA;
      --green: #16A34A;
      --green-light: #DCFCE7;
      --bg: #ffffff;
      --bg2: #f8f7f4;
      --bg3: #f1efe8;
      --text: #1a1a1a;
      --text2: #6b7280;
      --border: rgba(0,0,0,0.12);
      --radius: 12px;
      --radius-sm: 8px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1c1c1e;
        --bg2: #2c2c2e;
        --bg3: #3a3a3c;
        --text: #f2f2f7;
        --text2: #aeaeb2;
        --border: rgba(255,255,255,0.12);
        --orange-light: #2d1a0a;
        --orange-border: #7c3a0e;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Source Sans 3', sans-serif; background: var(--bg3); color: var(--text); min-height: 100vh; }

    /* Header */
    .header { background: var(--bg); border-bottom: 0.5px solid var(--border); padding: 0 1rem; position: sticky; top: 0; z-index: 100; height: 56px; display: flex; align-items: center; gap: 12px; }
    .header-back { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--orange); padding: 4px 8px 4px 0; display: none; }
    .header-title { font-family: 'Playfair Display', serif; font-size: 1.2rem; font-weight: 700; flex: 1; }
    .header-sub { font-size: 12px; color: var(--text2); }

    /* Home */
    .home-hero { text-align: center; padding: 2rem 1rem 1.5rem; background: var(--bg); margin-bottom: 1rem; border-bottom: 0.5px solid var(--border); }
    .home-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 700; }
    .home-sub { font-size: 14px; color: var(--text2); margin-top: 6px; }

    .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 12px; }
    .cat-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.5rem 1rem; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transition: transform 0.15s; active: scale(0.97); }
    .cat-card:active { transform: scale(0.97); }
    .cat-icon { font-size: 3rem; line-height: 1; }
    .cat-name { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; }
    .cat-count { font-size: 12px; color: var(--text2); }
    .cat-prog-track { width: 100%; height: 5px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
    .cat-prog-fill { height: 100%; border-radius: 999px; background: var(--orange); transition: width 0.4s; }
    .cat-prog-fill.done { background: var(--green); }
    .cat-prog-label { font-size: 11px; color: var(--text2); min-height: 14px; }

    /* Recipe list */
    .list-wrap { padding: 12px; }
    .cat-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 0 12px 12px; scrollbar-width: none; }
    .cat-tabs::-webkit-scrollbar { display: none; }
    .cat-tab { flex-shrink: 0; padding: 7px 14px; border-radius: 999px; border: 0.5px solid var(--border); background: var(--bg); color: var(--text2); font-size: 13px; font-family: 'Source Sans 3', sans-serif; cursor: pointer; font-weight: 500; white-space: nowrap; }
    .cat-tab.active { background: var(--orange); border-color: var(--orange); color: #fff; }
    .recipe-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
    .recipe-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1rem; cursor: pointer; transition: transform 0.15s; }
    .recipe-card:active { transform: scale(0.97); }
    .card-prog-bar { height: 3px; border-radius: 999px; background: var(--bg3); margin-bottom: 8px; overflow: hidden; }
    .card-prog-fill { height: 100%; border-radius: 999px; background: var(--orange); transition: width 0.3s; }
    .card-prog-fill.done { background: var(--green); }
    .card-emoji { font-size: 1.6rem; margin-bottom: 5px; display: block; }
    .card-title { font-family: 'Playfair Display', serif; font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; line-height: 1.3; }
    .card-desc { font-size: 11px; color: var(--text2); line-height: 1.4; }
    .card-meta { display: flex; gap: 5px; margin-top: 7px; flex-wrap: wrap; }
    .badge { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 999px; }
    .badge-time { background: #FEF3C7; color: #92400E; }
    .badge-level { background: #DBEAFE; color: #1E40AF; }
    .badge-pct { background: #FEE2E2; color: #991B1B; }
    .badge-pct.done { background: var(--green-light); color: #15803D; }

    /* Detail */
    .detail-wrap { padding: 12px; }
    .detail-card { background: var(--bg); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 1.25rem; }
    .detail-hdr { display: flex; gap: 12px; align-items: flex-start; margin-bottom: 1rem; padding-bottom: 1rem; border-bottom: 0.5px solid var(--border); }
    .detail-emoji { font-size: 2.5rem; }
    .detail-title { font-family: 'Playfair Display', serif; font-size: 1.3rem; font-weight: 700; margin-bottom: 3px; line-height: 1.2; }
    .detail-sub { font-size: 13px; color: var(--text2); line-height: 1.5; }

    /* Progress */
    .prog-wrap { margin-bottom: 1rem; }
    .prog-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .prog-lbl { font-size: 13px; color: var(--text2); }
    .prog-pct { font-size: 15px; font-weight: 500; color: var(--orange); }
    .prog-pct.done { color: var(--green); }
    .prog-track { height: 8px; background: var(--bg3); border-radius: 999px; overflow: hidden; }
    .prog-bar { height: 100%; border-radius: 999px; background: var(--orange); transition: width 0.4s; }
    .prog-bar.done { background: var(--green); }
    .reset-btn { font-size: 12px; color: var(--text2); background: none; border: 0.5px solid var(--border); border-radius: 999px; cursor: pointer; font-family: 'Source Sans 3', sans-serif; padding: 3px 10px; }

    /* Two col */
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; margin-top: 1rem; }
    @media (max-width: 480px) { .two-col { grid-template-columns: 1fr; } }
    .section-lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--orange); margin-bottom: 8px; }
    .ingr-list { list-style: none; }
    .ingr-list li { font-size: 13px; padding: 4px 0; border-bottom: 0.5px solid var(--border); display: flex; gap: 8px; }
    .ingr-list li:last-child { border-bottom: none; }
    .ingr-qty { font-weight: 500; min-width: 70px; color: var(--text2); font-size: 12px; }
    .steps-list { list-style: none; }
    .step-item { display: flex; gap: 10px; align-items: flex-start; padding: 7px 4px; border-bottom: 0.5px solid var(--border); cursor: pointer; border-radius: 6px; }
    .step-item:last-child { border-bottom: none; }
    .step-item:active { background: var(--bg2); }
    .step-chk { width: 22px; height: 22px; min-width: 22px; border-radius: 50%; border: 2px solid var(--orange); display: flex; align-items: center; justify-content: center; margin-top: 1px; transition: all 0.2s; background: transparent; }
    .step-chk.checked { background: var(--orange); border-color: var(--orange); }
    .step-chk.checked svg { display: block; }
    .step-chk svg { display: none; width: 12px; height: 12px; }
    .step-txt { font-size: 13px; line-height: 1.6; color: var(--text); transition: color 0.2s; flex: 1; }
    .step-txt.done { color: var(--text2); text-decoration: line-through; }
    .tip-box { background: var(--orange-light); border: 0.5px solid var(--orange-border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 1rem; font-size: 13px; color: #92400E; line-height: 1.6; }
    .tip-lbl { font-weight: 600; margin-right: 4px; }
    .complete-pill { display: inline-flex; align-items: center; gap: 4px; background: var(--green-light); color: #15803D; font-size: 11px; font-weight: 500; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
  </style>
</head>

const checkedSteps={};
function getChecked(id){if(!checkedSteps[id])checkedSteps[id]=new Set();return checkedSteps[id];}
function toggleStep(rid,i){const s=getChecked(rid);s.has(i)?s.delete(i):s.add(i);updateProgressUI(rid);}
function updateProgressUI(rid){
  const all=Object.values(recipes).flat();
  const r=all.find(x=>x.id===rid);if(!r)return;
  const total=r.pasos.length,done=getChecked(rid).size;
  const pct=Math.round((done/total)*100);const isDone=pct===100;
  const pe=document.getElementById('pct-'+rid),be=document.getElementById('bar-'+rid),le=document.getElementById('lbl-'+rid);
  if(pe){pe.className='prog-pct'+(isDone?' done':'');pe.innerHTML=isDone?pct+'% <span class="complete-pill">¡Listo! 🎉</span>':pct+'%';}
  if(be){be.style.width=pct+'%';be.className='prog-bar'+(isDone?' done':'');}
  if(le)le.textContent=done+' de '+total+' pasos completados';
  r.pasos.forEach((_,i)=>{
    const te=document.getElementById('st-'+rid+'-'+i),ce=document.getElementById('sc-'+rid+'-'+i);
    if(te)te.className='step-txt'+(getChecked(rid).has(i)?' done':'');
    if(ce)ce.className='step-chk'+(getChecked(rid).has(i)?' checked':'');
  });
  const cb=document.getElementById('cpb-'+rid);if(cb){cb.style.width=pct+'%';cb.className='card-prog-fill'+(isDone?' done':'');}
  const cp=document.getElementById('cpp-'+rid);if(cp){cp.className='badge badge-pct'+(isDone?' done':'');cp.textContent=pct+'%';cp.style.display=pct>0?'':'none';}
  const cat=Object.keys(recipes).find(k=>recipes[k].some(x=>x.id===rid));
  updateHomeCatProgress(cat);
}
function getCatProgress(catId){
  const list=recipes[catId];let t=0,d=0;
  list.forEach(r=>{t+=r.pasos.length;d+=getChecked(r.id).size;});
  return t>0?Math.round((d/t)*100):0;
}
function updateHomeCatProgress(catId){
  const pct=getCatProgress(catId);const isDone=pct===100;
  const bar=document.getElementById('hbar-'+catId),lbl=document.getElementById('hpct-'+catId);
  if(bar){bar.style.width=pct+'%';bar.className='cat-prog-fill'+(isDone?' done':'');}
  if(lbl)lbl.textContent=pct>0?(isDone?'¡Categoría completa! 🎉':pct+'% completado'):'';
}
function resetSteps(rid){checkedSteps[rid]=new Set();updateProgressUI(rid);}

let currentCategory=null,selectedRecipe=null;
function goHome(){currentCategory=null;selectedRecipe=null;render();}
function selectCategory(id){currentCategory=id;selectedRecipe=null;render();}
function selectRecipe(id){selectedRecipe=id;render();}
function backToList(){selectedRecipe=null;render();}
function handleBack(){
  if(selectedRecipe)backToList();
  else if(currentCategory)goHome();
}

function render(){
  const main=document.getElementById('main');
  const backBtn=document.getElementById('backBtn');
  const headerTitle=document.getElementById('headerTitle');
  const headerSub=document.getElementById('headerSub');

  if(!currentCategory){
    backBtn.style.display='none';
    headerTitle.textContent='🔥 Carnita Asada';
    headerSub.textContent='40 recetas para tu asada';
    main.innerHTML=`
      <div class="home-hero">
        <div class="home-title">🔥 Carnita Asada 🔥</div>
        <div class="home-sub">Selecciona una categoría para empezar</div>
      </div>
      <div class="cat-grid">
        ${categories.map(c=>{
          const pct=getCatProgress(c.id);const isDone=pct===100;
          return`<div class="cat-card" onclick="selectCategory('${c.id}')">
            <span class="cat-icon">${c.icon}</span>
            <div class="cat-name">${c.label}</div>
            <div class="cat-count">${recipes[c.id].length} recetas</div>
            <div class="cat-prog-track">
              <div class="cat-prog-fill${isDone?' done':''}" id="hbar-${c.id}" style="width:${pct}%"></div>
            </div>
            <div class="cat-prog-label" id="hpct-${c.id}">${pct>0?(isDone?'¡Categoría completa! 🎉':pct+'% completado'):''}</div>
          </div>`;}).join('')}
      </div>`;
    return;
  }

  const cat=categories.find(c=>c.id===currentCategory);

  if(!selectedRecipe){
    backBtn.style.display='block';
    headerTitle.textContent=cat.icon+' '+cat.label;
    headerSub.textContent=recipes[currentCategory].length+' recetas';
    const list=recipes[currentCategory];
    main.innerHTML=`
      <div class="cat-tabs">
        ${categories.map(c=>`<button class="cat-tab ${c.id===currentCategory?'active':''}" onclick="selectCategory('${c.id}')">${c.icon} ${c.label}</button>`).join('')}
      </div>
      <div class="list-wrap">
        <div class="recipe-grid">
          ${list.map(r=>{
            const total=r.pasos.length,done=getChecked(r.id).size,pct=Math.round((done/total)*100),isDone=pct===100;
            return`<div class="recipe-card" onclick="selectRecipe('${r.id}')">
              <div class="card-prog-bar"><div class="card-prog-fill${isDone?' done':''}" id="cpb-${r.id}" style="width:${pct}%"></div></div>
              <span class="card-emoji">${r.emoji}</span>
              <div class="card-title">${r.title}</div>
              <div class="card-desc">${r.desc}</div>
              <div class="card-meta">
                <span class="badge badge-time">⏱ ${r.time}</span>
                <span class="badge badge-level">${r.level}</span>
                <span class="badge badge-pct${isDone?' done':''}" id="cpp-${r.id}" style="display:${pct>0?'':'none'}">${pct}%</span>
              </div>
            </div>`;}).join('')}
        </div>
      </div>`;
    return;
  }

  const all=Object.values(recipes).flat();
  const r=all.find(x=>x.id===selectedRecipe);
  const total=r.pasos.length,done=getChecked(r.id).size,pct=Math.round((done/total)*100),isDone=pct===100;
  backBtn.style.display='block';
  headerTitle.textContent=r.title;
  headerSub.textContent=cat.icon+' '+cat.label;
  main.innerHTML=`
    <div class="detail-wrap">
      <div class="detail-card">
        <div class="detail-hdr">
          <span class="detail-emoji">${r.emoji}</span>
          <div style="flex:1">
            <div class="detail-title">${r.title}</div>
            <div class="detail-sub">${r.desc}</div>
            <div class="card-meta" style="margin-top:8px">
              <span class="badge badge-time">⏱ ${r.time}</span>
              <span class="badge badge-level">${r.level}</span>
              <span class="badge" style="background:#D1FAE5;color:#065F46;font-size:10px">${r.servings}</span>
            </div>
          </div>
        </div>
        <div class="prog-wrap">
          <div class="prog-hdr">
            <span class="prog-lbl" id="lbl-${r.id}">${done} de ${total} pasos completados</span>
            <div style="display:flex;align-items:center;gap:8px">
              <button class="reset-btn" onclick="resetSteps('${r.id}')">Reiniciar</button>
              <span class="prog-pct${isDone?' done':''}" id="pct-${r.id}">${isDone?pct+'% <span class=\'complete-pill\'>🎉</span>':pct+'%'}</span>
            </div>
          </div>
          <div class="prog-track"><div class="prog-bar${isDone?' done':''}" id="bar-${r.id}" style="width:${pct}%"></div></div>
        </div>
        <div class="two-col">
          <div>
            <div class="section-lbl">Ingredientes</div>
            <ul class="ingr-list">${r.ingredientes.map(i=>`<li><span class="ingr-qty">${i.qty}</span><span>${i.name}</span></li>`).join('')}</ul>
          </div>
          <div>
            <div class="section-lbl">Preparación</div>
            <ul class="steps-list">${r.pasos.map((p,i)=>`
              <li class="step-item" onclick="toggleStep('${r.id}',${i})">
                <div class="step-chk${getChecked(r.id).has(i)?' checked':''}" id="sc-${r.id}-${i}">
                  <svg viewBox="0 0 12 12" fill="none"><polyline points="1.5,6 4.5,9 10.5,3" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <span class="step-txt${getChecked(r.id).has(i)?' done':''}" id="st-${r.id}-${i}">${p}</span>
              </li>`).join('')}
            </ul>
          </div>
        </div>
        <div class="tip-box"><span class="tip-lbl">Consejo del asador:</span> ${r.tip}</div>
      </div>
    </div>`;
}

if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
